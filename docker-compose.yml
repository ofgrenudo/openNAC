services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: opennac
      POSTGRES_USER: opennac
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennac -d opennac"]
      interval: 5s
      timeout: 3s
      retries: 10

  freeradius:
    build: ./docker/freeradius
    platform: linux/amd64
    command: ["-X"]          # debug output; remove for production
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: opennac
      DB_USER: opennac
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    # volumes:
    #   - ./docker/freeradius/raddb:/etc/freeradius   # enable once raddb/ exists

volumes:
  db-data:
